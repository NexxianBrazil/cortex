# =========================================================================
# EXEMPLO / SEED — catálogo fictício para desenvolvimento e testes.
# NÃO é conteúdo curado de produção. Substitua antes de qualquer deploy.
# =========================================================================
# Catálogo de TOOLS: cada ação atômica é declarada UMA única vez aqui e
# referenciada pelos playbooks pelo nome. Nesta fase são só declarações
# (contrato) — nada executa ainda. O risco_base (low/medium/high/critical)
# será consumido pela Decision Engine na Fase 4.
# =========================================================================
tools:
  - nome: consultar_kb
    descricao: >-
      Consulta a Knowledge Base — a VERDADE DECLARADA da empresa (políticas,
      regras, prazos, condições). Consulte SEMPRE que a pergunta envolver
      política, regra, prazo ou condição da empresa: a KB prevalece sobre o que
      você lembra (KB > memória). Devolve trechos com fonte, autoridade e
      vigência; só traz o que está vigente. Se nada for relevante, diz isso
      explicitamente — não invente política.
    risco_base: low
    parametros:
      - nome: pergunta
        tipo: string
        descricao: 'A pergunta em linguagem natural (ex.: "qual o desconto máximo?")'
      - nome: dominio
        tipo: string
        descricao: Domínio para filtrar (ex.- "comercial"); opcional
        obrigatorio: false

  - nome: consultar_preco
    descricao: >-
      Consulta o preço e a disponibilidade ATUAIS de um produto — dado VIVO do
      system of record (SAP/SQL). Consulte sempre que precisar do valor atual;
      NUNCA confie em preço lembrado de conversa anterior (o preço muda na
      fonte). Ação somente leitura, sem efeito externo.
    risco_base: low
    system_of_record: true
    parametros:
      - nome: codigo_produto
        tipo: string
        descricao: Código do produto no catálogo interno
      - nome: quantidade
        tipo: integer
        descricao: Quantidade desejada, para cálculo de preço por faixa
        obrigatorio: false

  - nome: consultar_cliente
    descricao: >-
      Consulta o cadastro comercial ATUAL de um cliente — dado VIVO do system of
      record: razão social, limite de crédito, condição de pagamento padrão e se
      está bloqueado. Consulte sempre que precisar do estado atual do cliente;
      nunca confie em valor lembrado de conversa anterior. Somente leitura.
    risco_base: low
    system_of_record: true
    parametros:
      - nome: cliente_id
        tipo: string
        descricao: Identificador do cliente no cadastro

  - nome: emitir_cotacao
    descricao: >-
      Gera o documento formal de cotação a partir dos itens, preços e
      condições. Cria um registro oficial com número de cotação, mas ainda
      não comunica nada ao cliente.
    risco_base: medium
    parametros:
      - nome: cliente_id
        tipo: string
        descricao: Identificador do cliente no cadastro
      - nome: itens
        tipo: array
        descricao: Lista de itens com código, quantidade e preço unitário
      - nome: condicao_pagamento
        tipo: string
        descricao: Condição de pagamento (deve estar na tabela padrão)
      - nome: valor_total
        tipo: number
        descricao: Valor total da cotação (usado pela política de risco; teto de alçada)
        obrigatorio: false
      - nome: validade_dias
        tipo: integer
        descricao: Validade da cotação em dias
        obrigatorio: false

  - nome: enviar_email
    descricao: >-
      Envia e-mail em nome da persona. O risco é POR ESCOPO (Fase 4): base
      baixo para e-mail interno; a política eleva para alto quando o
      destinatário é externo, e crítico se houver anexo (dado de cliente
      saindo). O risco mora na chamada concreta, não no tipo da tool.
    risco_base: low
    parametros:
      - nome: destinatario
        tipo: string
        descricao: Endereço de e-mail do destinatário
      - nome: assunto
        tipo: string
        descricao: Assunto da mensagem
      - nome: corpo
        tipo: string
        descricao: Corpo da mensagem
      - nome: anexos
        tipo: array
        descricao: Documentos anexados (ex. o PDF da cotação)
        obrigatorio: false
      - nome: promete_condicao
        tipo: boolean
        descricao: O e-mail promete desconto/prazo/condição comercial ao cliente?
        obrigatorio: false
      - nome: cotacao_emitida
        tipo: boolean
        descricao: Há cotação formal emitida que dê lastro à condição prometida?
        obrigatorio: false
