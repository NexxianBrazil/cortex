[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex"
version = "0.0.1"
description = "Cortex — plataforma de profissional digital (ACP, Artificial Cognitive Persona) on-premise"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Nexxian" },
]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]
# Persistência da memória (Fase 3b). Extra SEPARADO de propósito: a stack do
# Graphiti/Kuzu é pesada e o CI não precisa dela — os testes de persistência
# se pulam quando o pacote não está instalado. Instale com:
#   uv pip install -e ".[graphiti]"
# Nota: o backend Kuzu está deprecado no graphiti-core upstream; segue sendo a
# única opção embarcada/sem servidor e fica isolada atrás do MemoryStore ABC.
graphiti = [
    "graphiti-core[kuzu]>=0.29",
]

[project.scripts]
cortex = "cortex.__main__:main"

[project.urls]
Repository = "https://github.com/NexxianBrazil/cortex"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# reference/ guarda o protótipo original (ponto de partida da Fase 3), mantido
# verbatim como artefato histórico — não é código do projeto e não é lintado.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
